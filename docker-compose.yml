# Local development PostgreSQL. Credentials are development-only placeholders.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: exhibition
      POSTGRES_PASSWORD: exhibition_dev_password
      POSTGRES_DB: exhibition
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exhibition -d exhibition"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
